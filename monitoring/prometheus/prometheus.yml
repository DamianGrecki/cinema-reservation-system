scrape_configs:
  - job_name: 'Auth Service Metrics'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 3s
    basic_auth:
      username: 'prometheus'
      password: '123'
    static_configs:
      - targets: ['auth-service:8081']
        labels:
          application: 'Auth Service'

  - job_name: 'Cinema Service Metrics'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 3s
    basic_auth:
      username: 'prometheus'
      password: '123'
    static_configs:
      - targets: ['cinema-service:8080']
        labels:
          application: 'Cinema Service'

  - job_name: 'Mail Service Metrics'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 3s
    basic_auth:
      username: 'prometheus'
      password: '123'
    static_configs:
      - targets: ['mail-service:8082']
        labels:
          application: 'Mail Service'
