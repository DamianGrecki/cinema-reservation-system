name: Deploy

on:
  workflow_dispatch:
    inputs:
      auth_service_replicas:
        description: 'auth-service replicas'
        default: '1'
        type: string
      cinema_service_replicas:
        description: 'cinema-service replicas'
        default: '2'
        type: string
      mail_service_replicas:
        description: 'mail-service replicas'
        default: '1'
        type: string
      payment_mock_replicas:
        description: 'payment-mock replicas'
        default: '1'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/damiangrecki/cinema

jobs:

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Check code formatting
        run: ./mvnw spotless:check -q
      - name: Build and run tests
        run: ./mvnw clean verify -q

  build-images:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test
    permissions:
      packages: write
    strategy:
      matrix:
        include:
          - service: auth-service
            dockerfile: docker/Dockerfile.auth-service
          - service: cinema-service
            dockerfile: docker/Dockerfile.cinema-service
          - service: mail-service
            dockerfile: docker/Dockerfile.mail-service
          - service: payment-provider-mock
            dockerfile: mocks/payment/provider/Dockerfile
            context: mocks/payment/provider
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v4

      - name: Prepare prometheus config
        run: |
          sed -i "s/password: '.*'/password: '${{ secrets.PROMETHEUS_PASSWORD }}'/" monitoring/prometheus/prometheus.yml
          sed -i "s/username: '.*'/username: '${{ secrets.PROMETHEUS_USER }}'/" monitoring/prometheus/prometheus.yml

      - name: Prepare nginx config
        run: sed -i "s/YOUR_DOMAIN/${{ secrets.VPS_DOMAIN }}/g" docker/nginx/nginx.conf

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker/docker-stack.yml,docker/nginx/,monitoring/
          target: ~/cinema

      - name: Deploy stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export LOG_BASE="$HOME/cinema/logs"
            mkdir -p "$LOG_BASE/auth-service" "$LOG_BASE/cinema-service" "$LOG_BASE/mail-service"

            export IMAGE_TAG='${{ github.sha }}'
            export IMAGE_PREFIX='${{ env.IMAGE_PREFIX }}'

            docker pull $IMAGE_PREFIX/auth-service:$IMAGE_TAG
            docker pull $IMAGE_PREFIX/cinema-service:$IMAGE_TAG
            docker pull $IMAGE_PREFIX/mail-service:$IMAGE_TAG
            docker pull $IMAGE_PREFIX/payment-provider-mock:$IMAGE_TAG

            cd ~/cinema/docker

            export CINEMA_DB_USER='${{ secrets.CINEMA_DB_USER }}'
            export CINEMA_DB_PASSWORD='${{ secrets.CINEMA_DB_PASSWORD }}'
            export CINEMA_DB_NAME='${{ secrets.CINEMA_DB_NAME }}'
            export AUTH_DB_USER='${{ secrets.AUTH_DB_USER }}'
            export AUTH_DB_PASSWORD='${{ secrets.AUTH_DB_PASSWORD }}'
            export AUTH_DB_NAME='${{ secrets.AUTH_DB_NAME }}'
            export MAIL_DB_USER='${{ secrets.MAIL_DB_USER }}'
            export MAIL_DB_PASSWORD='${{ secrets.MAIL_DB_PASSWORD }}'
            export MAIL_DB_NAME='${{ secrets.MAIL_DB_NAME }}'
            export GRAFANA_USER='${{ secrets.GRAFANA_USER }}'
            export GRAFANA_PASSWORD='${{ secrets.GRAFANA_PASSWORD }}'
            export PROMETHEUS_USER='${{ secrets.PROMETHEUS_USER }}'
            export PROMETHEUS_PASSWORD='${{ secrets.PROMETHEUS_PASSWORD }}'
            export JWT_SECRET='${{ secrets.JWT_SECRET }}'
            export KAFKA_HMAC_SECRET='${{ secrets.KAFKA_HMAC_SECRET }}'
            export TICKET_SIGNING_SECRET='${{ secrets.TICKET_SIGNING_SECRET }}'
            export AUTH_CLIENT_SECRET='${{ secrets.AUTH_CLIENT_SECRET }}'

            export AUTH_SERVICE_REPLICAS='${{ inputs.auth_service_replicas }}'
            export CINEMA_SERVICE_REPLICAS='${{ inputs.cinema_service_replicas }}'
            export MAIL_SERVICE_REPLICAS='${{ inputs.mail_service_replicas }}'
            export PAYMENT_MOCK_REPLICAS='${{ inputs.payment_mock_replicas }}'

            docker stack deploy -c docker-stack.yml cinema --with-registry-auth

            docker service update --force cinema_prometheus
