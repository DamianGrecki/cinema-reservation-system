name: Scale

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to scale'
        required: true
        type: choice
        options:
          - auth-service
          - cinema-service
          - mail-service
          - payment-mock
      replicas:
        description: 'Replica count'
        required: true
        default: '1'
        type: string

jobs:
  scale:
    name: Scale ${{ inputs.service }} to ${{ inputs.replicas }}
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker service scale cinema_${{ inputs.service }}=${{ inputs.replicas }}
            docker service ps cinema_${{ inputs.service }} --no-trunc
