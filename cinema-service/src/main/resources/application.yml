server:
  port: 8080

app:
  log-path: logs

logging:
  level:
    pl.dgrecki.logs.RequestLoggingFilter: INFO

spring:
  datasource:
    url: jdbc:postgresql://localhost:1010/cinema_db
    username: cinema_user
    password: 123 # It will eventually be moved to .env

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  liquibase:
    enabled: true
    change-log: db/changelog/db.changelog-master.xml

jwt:
  secret: superDlugiKluczMinimum32ZnakiTutaj

management:
  endpoints:
    web:
      exposure:
        include: '*'

  endpoint:
    health:
      show-details: always

scheduler:
  reservation:
    update:
      limit: 100
      delay-ms: 60000
    delete:
      older-than-days: 1
      limit: 100
      delay-ms: 60000
  basket:
    delete:
      older-than-days: 1
      limit: 100
      delay-ms: 60000

payment-provider:
  attempts-limit: 3
  sandbox:
    host: http://localhost:1080

